[build-system]
requires      = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name            = "exfer-mcp"
dynamic         = ["version"]
description     = "Model Context Protocol server that lets an AI agent spend from an Exfer wallet — typed tools over exfer-walletd, with no per-transaction human approval"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors         = [{ name = "exfer-stack" }]
keywords        = ["exfer", "mcp", "agent", "wallet", "crypto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The Python SDK's canonical PyPI package is now `exfer` (formerly published as
# `exfer-walletd`; import name is `exfer`). The swap on-ramp tools need the
# cross-chain methods added in exfer 0.11.0a1 (swap_*/bsc_*), so the floor is a
# prerelease — a prerelease floor also lets resolvers pick the prerelease SDK.
dependencies = [
    "exfer>=0.11.0a1,<1.0",
    "mcp>=1.0,<2.0",
    # Cross-platform process inspection/termination for the managed-walletd
    # orphan reaper (Linux/macOS/Windows) — replaces the old /proc-only path.
    "psutil>=5.9",
    # CA bundle for the walletd-binary download: Python's stock urllib has no
    # usable trust store on Windows, so verification needs certifi explicitly.
    "certifi>=2024.0.0",
]

[project.scripts]
# The single entrypoint a Claude Desktop / Claude Code config refers
# to. The stdio transport is launched here.
exfer-mcp = "exfer_mcp.server:main"

[project.urls]
Homepage      = "https://github.com/exfer-stack/exfer-mcp"
Repository    = "https://github.com/exfer-stack/exfer-mcp"
"Bug Tracker" = "https://github.com/exfer-stack/exfer-mcp/issues"
"exfer-walletd (Rust daemon)" = "https://github.com/exfer-stack/exfer-walletd"
"exfer (Python SDK)"          = "https://github.com/exfer-stack/exfer-py"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10,<2.0",
    "ruff>=0.5",
    "types-psutil",
]

[tool.hatch.version]
path = "src/exfer_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/exfer_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/exfer_mcp",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length    = 100
target-version = "py310"
src            = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version          = "3.10"
strict                  = true
warn_unreachable        = true
disallow_any_unimported = true
files                   = ["src/exfer_mcp"]

[[tool.mypy.overrides]]
module                 = ["respx"]
ignore_missing_imports = true

# The `mcp` SDK's `Server.list_tools()` / `Server.call_tool()` decorators
# are not typed in the upstream package. We can't make them strict without
# stubs; silence the two specific codes they emit so we don't slacken
# strict-mode elsewhere.
[[tool.mypy.overrides]]
module                = ["exfer_mcp.server"]
disable_error_code    = ["no-untyped-call", "misc", "untyped-decorator"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = ["src"]
asyncio_mode = "auto"
