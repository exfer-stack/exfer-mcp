name: Release

# Mirrors the tag-driven release flow of `exfer-stack/exfer-walletd`:
# push a `v*` tag → CI builds artifacts, publishes them, creates a
# GitHub Release with auto-generated notes. Python-side adapts the
# walletd recipe to wheel + sdist (no cross-compilation matrix — pure
# Python) and adds PyPI publishing via OpenID Connect trusted
# publishing (no long-lived tokens).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # softprops/action-gh-release creates the Release
  id-token: write    # PyPI trusted publishing OIDC

jobs:
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Build
        run: uv build
      - name: Smoke-check artifacts
        run: |
          python -m pip install --upgrade pip twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing requires the workflow to run in an
    # environment whose name matches the configured pending publisher.
    # Configure once at https://pypi.org/manage/project/exfer-mcp/settings/publishing/
    # then this job runs without any secret token.
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so auto release notes can diff
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
