name: CI

# Test + lint + type gates on every push and PR. (release.yml only runs on a
# version tag and publishes — it never tested anything.)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: ruff + mypy + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (incl. dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Types (mypy)
        run: mypy src
      - name: Test (pytest)
        run: pytest -q
